name: Preview digest

# TEMPORARY (removed before merge): runs the new digest prompt on the live feed and prints the result.
# No Pages deploy — nothing is published.
on:
  push:
    branches: [claude/digest-richer-text]
    paths: ["pipeline.js", "scripts/preview-digest.js", ".github/workflows/preview.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  LLM_MODEL: qwen2.5:7b

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache model
        uses: actions/cache@v6
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.LLM_MODEL }}

      - name: Start open model (Ollama)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          OLLAMA_MODELS="$HOME/.ollama/models" nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 1; done
          ollama pull "$LLM_MODEL"

      - name: Preview digest
        env:
          LLM_URL: http://localhost:11434/v1
          PREV_URL: https://data.cobunai.com
        run: node scripts/preview-digest.js
